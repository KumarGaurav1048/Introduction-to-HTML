<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables</title>
</head>
<body>
    <table border="1">
        <tr>
            <th>S.No:</th>
            <th>Item</th>
            <th>Price</th>
            <th>Action</th>
        </tr>
        <tr>
            <td>1</td>
            <td>Apple</td>
            <td>$1.99</td>
            <td>Delete</td>
        </tr>
        <tr>
            <td>2</td>
            <td>Orange</td>
            <td>$2.99</td>
            <td>Delete</td>
        </tr>
        <tr>
            <td>3</td>
            <td>Watermelon</td>
            <td>$5.99</td>
            <td>Delete</td>
        </tr>
        <tr>
            <td>4</td>
            <td>Jonny</td>
            <td colspan="2">Manager</td>
        </tr>
        <tr>
            <td rowspan="2">Ankit</td>
            <td>Employee</td>
        </tr>
        <tr>
        <td>IT Department</td>
        </tr>
    </table>
</body>
</html>
