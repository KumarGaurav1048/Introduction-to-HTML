<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio Buttons</title>
</head>

<body>
    <h1> Fitness Form</h1>
    <form action="/process.php">
        <label for="name">Name</label>
        <input type="name" id="name" name="name" placeholder="Your Name">
        <br><br>

        <label for="phone">Phone</label>
        <input type="tel" id="phone" name="phone" placeholder="Your Phone">
        <br><br>

        <label for="pass">Password</label>
        <input type="password" id="pass" name="password" placeholder="Your Password">
        <br><br>

        <label for="cpass">Confirm Password</label>
        <input type="password" id="cpass" name="confirmpassword" placeholder="Your Confirm Passsword">
        <br><br>
        <p>Chosoe Your Gender</p>
        <label for="gender">Male</label>
        <input type="radio" id="gender" name="gender" value="male">

        <label for="gender">Female</label>
        <input type="radio" id="gender" name="gender" value="female">


        <label for="gender">Other</label>
        <input type="radio" id="other" name="gender" value="Other">
        <br>

        <p>Select your Hobbies:</p>
        <input type="checkbox" id="reading" name="hobby" value="reading">
        <label for="reading">Reading</label><br>

        <input type="checkbox" id="sports" name="hobby" value="sports">
        <label for="sports">Sports</label><br>

        <input type="checkbox" id="music" name="hobby" value="music">
        <label for="music">Music</label>
        <br><br>

        <label for="city">Choose a city:</label>
        <select id="city" name="city">
            <option value="delhi">Delhi</option>
            <option value="mumbai">Mumbai</option>
            <option value="bangalore">Bangalore</option>
        </select>
        <br><br>

        <label for="message">Description:</label><br>
        <textarea id="message" name="message" rows="4" cols="30"></textarea>
        <br><br>

        <input type="submit" value="Submit">
        <br>
    </form>
</body>
</html>
